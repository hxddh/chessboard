# Real responses for the C2 sync parsers (v8-0-plan C2, v8-1-plan T4).
#
# The app's native layer (src/main.zig chess.fetchGames) talks to two public
# endpoints; its unit tests parse samples written from the sites' docs. This
# workflow fetches the same URLs, with the same User-Agent, once, so the
# samples can be checked against — and replaced by — what the sites really
# send. Manual only: it is the one place the project's CI calls a third-party
# site, and it runs when a person presses the button, never on a push.
#
# Nothing is committed and no token is used for writing: each response is
# printed to the log, gzipped and base64-encoded between BEGIN/END markers,
# with its status line and headers, and read back from there.
name: sync samples

on:
  workflow_dispatch:
    inputs:
      lichess_user:
        description: Lichess account (public games)
        default: thibault
      chesscom_user:
        description: Chess.com account (public games)
        default: erik
      max:
        description: Lichess games to fetch
        default: "5"

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UA: "chessboard (+https://github.com/hxddh/chessboard)"
      LI_USER: ${{ inputs.lichess_user }}
      CC_USER: ${{ inputs.chesscom_user }}
      MAX: ${{ inputs.max }}
    steps:
      - name: Fetch
        shell: bash
        run: |
          set -u
          mkdir -p out
          get() { # name url
            curl -sS -A "$UA" -D "out/$1.headers" -o "out/$1.body" -w '%{http_code}' "$2" > "out/$1.status" || echo "curl-failed" > "out/$1.status"
            echo "$1: $(cat "out/$1.status") $(wc -c < "out/$1.body" 2>/dev/null || echo 0) bytes"
            sleep 2 # both sites ask for requests one at a time
          }
          # the exact URL chess.fetchGames builds (src/main.zig lichessUrl)
          get lichess "https://lichess.org/api/games/user/${LI_USER}?max=${MAX}&perfType=ultraBullet,bullet,blitz,rapid,classical,correspondence&clocks=true&evals=false&opening=false"
          get lichess-missing "https://lichess.org/api/games/user/no-such-user-chessboard-sample-404?max=1"
          lc_user=$(echo "$CC_USER" | tr 'A-Z' 'a-z')
          get chesscom-archives "https://api.chess.com/pub/player/${lc_user}/games/archives"
          last=$(node -e 'try{const a=JSON.parse(require("fs").readFileSync("out/chesscom-archives.body","utf8")).archives||[];console.log(a[a.length-1]||"")}catch{console.log("")}')
          if [ -n "$last" ]; then get chesscom-month "$last"; else echo "no archive month"; fi
          get chesscom-missing "https://api.chess.com/pub/player/no-such-user-chessboard-sample-404/games/archives"
      - name: Print
        shell: bash
        run: |
          for f in out/*.body; do
            n=$(basename "$f" .body)
            echo "=== $n status $(cat out/$n.status)"
            sed 's/^/HDR /' "out/$n.headers" | tr -d '\r'
            echo "BEGIN $n"
            gzip -9c "$f" | base64 -w 76
            echo "END $n"
          done
