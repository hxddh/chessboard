name: release

# Creates the git tag + GitHub Release from notes in .github/release-notes/.
# The macOS app zip cannot be built here (Native SDK is a local framework),
# so build it with scripts/package.sh and attach it to the release:
#   gh release upload <tag> dist/Chessboard-macOS-arm64.zip
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.18.0); notes file must exist"
        required: true

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: unit tests
        run: node scripts/test-chess.mjs
      # The engine-backed content checks. Both are opt-in locally (about four
      # minutes together) and were therefore run by hand, which meant the
      # properties they prove — no drilled opening line is a transcription
      # error, no "only one move wins" puzzle has a second solution — were
      # guarded by whoever remembered. A release is exactly the moment nobody
      # should be relying on remembering. They are platform-independent, so
      # they run here rather than in both platform builds. Each skips itself
      # with exit 0 if the vendored engine is missing.
      #
      # Both search to a fixed depth rather than a fixed time. Gating on a
      # time-limited search would have been a flaky gate: the closest opening
      # line and the closest puzzle each sat within ~20cp of their limit, which
      # is inside the run-to-run spread. See the header of either script.
      - name: content soundness (engine)
        run: |
          node scripts/test-openings.mjs
          node scripts/test-tactics.mjs
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          notes=".github/release-notes/${TAG}.md"
          test -f "$notes" || { echo "missing $notes"; exit 1; }
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file "$notes"
      - name: chain macOS build + asset upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh workflow run build-macos.yml --ref "$GITHUB_REF_NAME" -f release_tag="$TAG"
      - name: chain Windows build + asset upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh workflow run build-windows.yml --ref "$GITHUB_REF_NAME" -f release_tag="$TAG"
