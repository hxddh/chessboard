name: release

# Creates the git tag + GitHub Release from notes in .github/release-notes/,
# with both platform packages attached, once every gate below is green.
#
# 7.6 (v7-6-plan §5): the gates run as parallel jobs. Until 7.5 this was one
# job that ran them in a row — static, engine, then every browser suite on
# Chromium and then again on WebKit (2 h 36 min of a 3 h 11 min release) —
# and only then dispatched the two platform builds and waited for them. Now:
#
#   preflight ─┐
#   static ────┤
#   engine ×8 ─┤
#   browser ×10┼──► publish: tag → draft with both packages → verify → publish
#   build-macos┤
#   build-win ─┘
#
# `publish` needs every one of them, so the guarantee is the one the serial
# job gave: if anything is red, nothing is tagged and nothing is published.
# The platform builds are this run's own jobs (build-*.yml via workflow_call),
# built from the commit this run checked out — the same commit the tag will
# name — and their packages travel as artifacts, not through the release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.18.0); notes file must exist"
        required: true
      sdk_version:
        # Pinned, not "latest" — but not for the reason this comment used to
        # give. It said 0.8.0 shipped a Windows regression; it did not. 0.8.0
        # added src/platform/windows/gpu_surface_renderer.cpp and had
        # webview2_host.cpp call into it, and THIS repo's build.zig — a
        # hand-kept copy of the SDK's build/app.zig — compiled only
        # webview2_host.cpp. The undefined symbol was our source list lagging
        # upstream, not upstream breaking. Fixed in build.zig (the file plus
        # d2d1/dwrite, matching the SDK's own list), so the pin now moves to
        # 0.10.1. It stays a pin because everything else this gate depends on
        # is pinned too (playwright 1.62.1, zig 0.16.0): the SDK was the one
        # dependency that could change under a release with nobody changing
        # anything. Raise it deliberately, with a run that proves both
        # platforms still build.
        description: "@native-sdk/cli version both platform builds install"
        required: false
        default: "0.10.1"

permissions:
  contents: write
  actions: read

jobs:
  # The two things that would stop `publish` at the very end, checked in the
  # first minute instead of after every gate has run: the notes file exists,
  # and the tag is not already a published release. `publish` checks both
  # again — this job only makes a doomed run go red early.
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: notes exist, tag not yet published
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test -f ".github/release-notes/${TAG}.md" || { echo "missing .github/release-notes/${TAG}.md"; exit 1; }
          published=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq "[.[] | select(.tag_name==\"${TAG}\") | select(.draft==false)] | .[0].id // empty")
          [ -z "$published" ] || { echo "${TAG} is already published"; exit 1; }

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # esbuild, and nothing else. It bundles the ES modules under src/web/js
      # into the one classic script zero:// can load; `npm ci` rather than
      # `npm install` so the same commit gets the same bundler.
      - name: install build deps
        run: npm ci
      # 6.1: the whole static suite, for the same reason checks.yml runs it —
      # naming one script here meant seven others were not a release gate.
      - name: static tests
        run: npm run test:static

  # The engine-backed checks — every script in `npm run test:engine:sample`,
  # one job each (7.6: in a row they took 26 minutes, the longest gate once
  # the browser suites run side by side). scripts/test-chess.mjs checks that
  # this list is exactly that npm script's, arguments included, so a script
  # added there cannot be missing here.
  #
  # Why they gate a release at all: they are opt-in locally (minutes) and
  # were therefore run by hand, which meant the properties they prove — no
  # drilled opening line is a transcription error, no "only one move wins"
  # puzzle has a second solution, the novice levels really are weaker — were
  # guarded by whoever remembered. A release is exactly the moment nobody
  # should be relying on remembering. They are platform-independent, so they
  # run here rather than in both platform builds. Each skips itself with exit
  # 0 if the vendored engine is missing.
  #
  # The soundness checks search to a fixed depth rather than a fixed time.
  # Gating on a time-limited search would have been a flaky gate: the
  # closest opening line and the closest puzzle each sat within ~20cp of
  # their limit, which is inside the run-to-run spread. See the header of
  # either script.
  #
  # 7.1 (v7-1-plan §3.2): the sampled tier, not `test:engine`. The difference
  # is one script — the mined-puzzle gate runs over a fixed sample of 150
  # instead of all 1002 — and it is the difference between a release gate of
  # about half an hour and one of two and a half hours. The trade-off, stated
  # rather than hidden: a release searches 15% of the mined bank. The bank is
  # content that does not change between releases (it changed in 6.0, 6.1 and
  # 7.0, each time by a deliberate edit to puzzles-mined.js), so the full
  # sweep runs nightly on main (nightly.yml), a PR runs the same 150
  # (checks.yml), and anyone editing the bank runs `npm run test:engine` by
  # hand, which is what --fix already requires.
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        check:
          - node scripts/test-openings.mjs
          - node scripts/test-tactics.mjs
          - node scripts/test-novice.mjs
          - node scripts/test-strength.mjs
          - node scripts/test-analysis.mjs
          - node scripts/test-mines.mjs
          - node scripts/test-mined.mjs --sample=150
          - node scripts/test-motif.mjs --games=6
    name: engine (${{ matrix.check }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: install build deps
        run: npm ci
      - name: ${{ matrix.check }}
        run: ${{ matrix.check }}

  # The browser checks. Every one of them is a regression that shipped: the
  # board one is the `CHECK is not defined` that emptied the board for two
  # releases, the persistence one is the study position that vanished on
  # restart. They lived in the repo without guarding anything, because a
  # runner with no Chromium made them exit 0 with a notice. E2E_REQUIRED=1
  # turns that notice into a failure, so a green release means they ran.
  #
  # Both engines, because the app ships on both: Windows runs the page in
  # WebView2 (Chromium) and macOS in WKWebView (WebKit). Chromium alone gates
  # half the product. 7.6: engine × group, the same groups as checks.yml,
  # each group sized to be one of the long suites or a few short ones.
  # scripts/test-chess.mjs checks every suite in `npm run test:e2e` is here.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
        group:
          - name: board + sound + clock
            suites: scripts/test-board-e2e.mjs scripts/test-audio-e2e.mjs scripts/test-clock-e2e.mjs
          - name: lessons + review + engine
            suites: scripts/test-content-e2e.mjs scripts/test-review-e2e.mjs scripts/test-engine-e2e.mjs scripts/test-engine-flows-e2e.mjs
          - name: persistence
            suites: scripts/test-persist-e2e.mjs
          - name: game library
            suites: scripts/test-library-e2e.mjs
          - name: panel layout
            suites: scripts/test-layout-e2e.mjs
    name: browser (${{ matrix.engine }}, ${{ matrix.group.name }})
    env:
      E2E_REQUIRED: "1"
      E2E_BROWSER: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: install build deps
        run: npm ci
      # Playwright is pinned. An unpinned global install is how the same
      # commit comes out different on different days.
      - name: install playwright + ${{ matrix.engine }}
        run: |
          npm install --no-save playwright@1.62.1
          npx --yes playwright@1.62.1 install --with-deps ${{ matrix.engine }}
          path="$(node -e "console.log(require('playwright')['${{ matrix.engine }}'].executablePath())")"
          if [ "${{ matrix.engine }}" = chromium ]; then echo "CHROME_PATH=$path"; else echo "WEBKIT_PATH=$path"; fi >> "$GITHUB_ENV"
      # every suite in the group runs even when an earlier one fails, so one
      # red run says everything that is wrong in it
      - name: ${{ matrix.group.name }}
        env:
          SUITES: ${{ matrix.group.suites }}
        run: |
          failed=""
          for s in $SUITES; do
            echo "::group::$s"
            node "$s" || failed="$failed $s"
            echo "::endgroup::"
          done
          [ -z "$failed" ] || { echo "::error::failed:$failed"; exit 1; }

  # The platform builds, as jobs of this run (see the header). Each one runs
  # its own unit tests, zig tests and the packaged-app self-test
  # (scripts/selftest-app.mjs) and uploads its package as an artifact.
  build-macos:
    uses: ./.github/workflows/build-macos.yml
    with:
      sdk_version: ${{ inputs.sdk_version }}
  build-windows:
    uses: ./.github/workflows/build-windows.yml
    with:
      sdk_version: ${{ inputs.sdk_version }}

  publish:
    needs: [preflight, static, engine, browser, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: Chessboard-*
          path: dist
          merge-multiple: true
      - name: both packages are here
        run: |
          ls -l dist
          for f in Chessboard-macOS-arm64.zip Chessboard-macOS-arm64.dmg Chessboard-Windows-x64.zip; do
            test -f "dist/$f" || { echo "missing $f"; exit 1; }
          done
      # The tag names the commit every job above checked out and tested.
      #
      # And it has to be retryable. Until 2.0 a failure after this point left
      # a tag and a draft behind that made every later attempt die at
      # `gh release create` with "release already exists". The 2.0.0 release
      # hit exactly that: the Windows build failed on a CRLF-only test bug,
      # and the only way forward was to delete a tag and a draft by hand. A
      # release process that cannot be retried is one that gets finished by
      # hand, which is the opposite of what it is for. ("Re-run failed jobs"
      # reruns only what failed; the green gates are kept.)
      #
      # Retrying is allowed only while nothing has been published: a draft for
      # this tag is deleted, a *published* release for it stops the run.
      - name: tag the commit under test
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          notes=".github/release-notes/${TAG}.md"
          test -f "$notes" || { echo "missing $notes"; exit 1; }
          # one page, not --paginate: with --paginate the --jq runs per page and
          # emits one line each, so a two-page repo answers a yes/no question
          # with two lines. 100 is well above this repo's release count.
          rels=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100")
          published=$(printf '%s' "$rels" | jq -r "[.[] | select(.tag_name==\"${TAG}\") | select(.draft==false)] | .[0].id // empty")
          if [ -n "$published" ]; then
            echo "${TAG} is already published — refusing to retag it"
            exit 1
          fi
          draft=$(printf '%s' "$rels" | jq -r "[.[] | select(.tag_name==\"${TAG}\") | select(.draft==true)] | .[0].id // empty")
          if [ -n "$draft" ]; then
            echo "deleting the draft ${TAG} left by a failed attempt (release $draft)"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${draft}"
          fi
          git tag -f "$TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/${TAG}"
      - name: draft the release with both packages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "$TAG" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file ".github/release-notes/${TAG}.md" \
            dist/Chessboard-macOS-arm64.zip dist/Chessboard-macOS-arm64.dmg dist/Chessboard-Windows-x64.zip
      - name: the release must actually have both downloads
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          assets=$(gh release view "$TAG" --json assets --jq '[.assets[].name] | join(" ")')
          echo "assets: $assets"
          case "$assets" in *macOS-arm64.zip*) ;; *) echo "missing the macOS zip"; exit 1;; esac
          case "$assets" in *Windows-x64.zip*) ;; *) echo "missing the Windows zip"; exit 1;; esac
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release edit "$TAG" --draft=false
