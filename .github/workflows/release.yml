name: release

# A release is checks.yml on the commit, every path-gated job included (the
# native packages, built and self-tested on macOS and Windows; the opponents),
# and then, only if all of it is green, the tag and the GitHub release with
# the two packages checks.yml's native jobs built. Nothing here checks
# anything checks.yml does not — a PR already ran every one of these checks
# (scripts/ci-check.mjs holds that, ADR 0005).
#
#   1. .github/release-notes/<tag>.md exists and the tag is not published yet
#   2. checks.yml (workflow_call): every gate, and Chessboard-macOS-arm64 /
#      Chessboard-Windows-x64 as artifacts of this run
#   3. tag the commit, draft the release with both packages, check the draft
#      has both, publish
#
# `rehearse` runs 1–2 and checks the packages, and publishes nothing.
#
# Signing (v20-0-plan §7 E2) waits for the owner's certificates: the macOS
# package is ad-hoc signed and the Windows one unsigned (build-macos.yml,
# build-windows.yml say where the signing steps go).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v20.0.0); .github/release-notes/<tag>.md must exist"
        required: true
      rehearse:
        description: "Rehearse only: run every gate and check the packages, publish nothing"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  actions: read

jobs:
  preflight:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: notes exist, tag not yet published
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          REHEARSE: ${{ inputs.rehearse }}
        run: |
          set -euo pipefail
          if [ "$REHEARSE" = "true" ]; then echo "rehearsal: nothing will be tagged or published"; exit 0; fi
          test -f ".github/release-notes/${TAG}.md" || { echo "missing .github/release-notes/${TAG}.md"; exit 1; }
          published=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq "[.[] | select(.tag_name==\"${TAG}\") | select(.draft==false)] | .[0].id // empty")
          [ -z "$published" ] || { echo "${TAG} is already published"; exit 1; }

  checks:
    needs: preflight
    uses: ./.github/workflows/checks.yml

  publish:
    needs: [preflight, checks]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: Chessboard-*
          path: dist
          merge-multiple: true
          skip-decompress: false
          digest-mismatch: error
      - name: both packages are here
        run: |
          ls -lR dist
          for f in Chessboard-macOS-arm64.zip Chessboard-macOS-arm64.dmg Chessboard-Windows-x64.zip; do
            test -f "dist/$f" || { echo "missing $f"; exit 1; }
          done
          for f in Chessboard-macOS-arm64.zip Chessboard-Windows-x64.zip; do
            if unzip -Z1 "dist/$f" | grep -qiE '^Chessboard-.*\.(zip|dmg)$'; then
              echo "dist/$f is the artifact wrapper, not the package"; exit 1
            fi
          done
          unzip -Z1 dist/Chessboard-macOS-arm64.zip | grep -q '^Chessboard.app/Contents/MacOS/stockfish$' || { echo "the macOS package has no engine"; exit 1; }
          unzip -Z1 dist/Chessboard-Windows-x64.zip | grep -qi 'stockfish.exe$' || { echo "the Windows package has no engine"; exit 1; }
      - name: tag the commit under test
        if: ${{ !inputs.rehearse }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          rels=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100")
          published=$(printf '%s' "$rels" | jq -r "[.[] | select(.tag_name==\"${TAG}\") | select(.draft==false)] | .[0].id // empty")
          if [ -n "$published" ]; then echo "${TAG} is already published — refusing to retag it"; exit 1; fi
          draft=$(printf '%s' "$rels" | jq -r "[.[] | select(.tag_name==\"${TAG}\") | select(.draft==true)] | .[0].id // empty")
          if [ -n "$draft" ]; then
            echo "deleting the draft ${TAG} left by a failed attempt (release $draft)"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${draft}"
          fi
          git tag -f "$TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/${TAG}"
      - name: draft the release with both packages
        if: ${{ !inputs.rehearse }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "$TAG" \
            --notes-file ".github/release-notes/${TAG}.md" \
            dist/Chessboard-macOS-arm64.zip dist/Chessboard-macOS-arm64.dmg dist/Chessboard-Windows-x64.zip
      - name: the release must actually have both downloads
        if: ${{ !inputs.rehearse }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          assets=$(gh release view "$TAG" --json assets --jq '[.assets[].name] | join(" ")')
          echo "assets: $assets"
          case "$assets" in *macOS-arm64.zip*) ;; *) echo "missing the macOS zip"; exit 1;; esac
          case "$assets" in *Windows-x64.zip*) ;; *) echo "missing the Windows zip"; exit 1;; esac
      - name: publish
        if: ${{ !inputs.rehearse }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release edit "$TAG" --draft=false
