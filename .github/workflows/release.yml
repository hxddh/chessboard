name: release

# Creates the git tag + GitHub Release from notes in .github/release-notes/.
# The macOS app zip cannot be built here (Native SDK is a local framework),
# so build it with scripts/package.sh and attach it to the release:
#   gh release upload <tag> dist/Chessboard-macOS-arm64.zip
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.18.0); notes file must exist"
        required: true
      sdk_version:
        # Pinned, not "latest" — but not for the reason this comment used to
        # give. It said 0.8.0 shipped a Windows regression; it did not. 0.8.0
        # added src/platform/windows/gpu_surface_renderer.cpp and had
        # webview2_host.cpp call into it, and THIS repo's build.zig — a
        # hand-kept copy of the SDK's build/app.zig — compiled only
        # webview2_host.cpp. The undefined symbol was our source list lagging
        # upstream, not upstream breaking. Fixed in build.zig (the file plus
        # d2d1/dwrite, matching the SDK's own list), so the pin now moves to
        # 0.8.1. It stays a pin because everything else this gate depends on
        # is pinned too (playwright 1.62.1, zig 0.16.0): the SDK was the one
        # dependency that could change under a release with nobody changing
        # anything. Raise it deliberately, with a run that proves both
        # platforms still build.
        description: "@native-sdk/cli version both platform builds install"
        required: false
        default: "0.8.1"

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # esbuild, and nothing else. It bundles the ES modules under src/web/js
      # into the one classic script zero:// can load; `npm ci` rather than
      # `npm install` so the same commit gets the same bundler.
      - name: install build deps
        run: npm ci
      - name: unit tests
        run: node scripts/test-chess.mjs
      # The engine-backed content checks. Both are opt-in locally (about four
      # minutes together) and were therefore run by hand, which meant the
      # properties they prove — no drilled opening line is a transcription
      # error, no "only one move wins" puzzle has a second solution — were
      # guarded by whoever remembered. A release is exactly the moment nobody
      # should be relying on remembering. They are platform-independent, so
      # they run here rather than in both platform builds. Each skips itself
      # with exit 0 if the vendored engine is missing.
      #
      # Both search to a fixed depth rather than a fixed time. Gating on a
      # time-limited search would have been a flaky gate: the closest opening
      # line and the closest puzzle each sat within ~20cp of their limit, which
      # is inside the run-to-run spread. See the header of either script.
      - name: content soundness (engine)
        run: |
          node scripts/test-openings.mjs
          node scripts/test-tactics.mjs
      # The browser checks. Every one of them is a regression that shipped: the
      # board one is the `CHECK is not defined` that emptied the board for two
      # releases, the persistence one is the study position that vanished on
      # restart. They lived in the repo without guarding anything, because a
      # runner with no Chromium made them exit 0 with a notice. E2E_REQUIRED=1
      # turns that notice into a failure, so a green release means they ran.
      #
      # Playwright is pinned. An unpinned global install is how the same commit
      # comes out different on different days.
      # Both engines, because the app ships on both: Windows runs the page in
      # WebView2 (Chromium) and macOS in WKWebView (WebKit). Chromium alone
      # gates half the product.
      - name: browser regression tests
        env:
          E2E_REQUIRED: "1"
        run: |
          npm install --no-save playwright@1.62.1
          npx --yes playwright@1.62.1 install --with-deps chromium webkit
          for engine in chromium webkit; do
            echo "::group::$engine"
            path="$(node -e "console.log(require('playwright')['$engine'].executablePath())")"
            if [ "$engine" = chromium ]; then export CHROME_PATH="$path"; else export WEBKIT_PATH="$path"; fi
            E2E_BROWSER="$engine" node scripts/test-board-e2e.mjs
            E2E_BROWSER="$engine" node scripts/test-audio-e2e.mjs
            E2E_BROWSER="$engine" node scripts/test-clock-e2e.mjs
            E2E_BROWSER="$engine" node scripts/test-content-e2e.mjs
            E2E_BROWSER="$engine" node scripts/test-persist-e2e.mjs
            E2E_BROWSER="$engine" node scripts/test-review-e2e.mjs
            E2E_BROWSER="$engine" node scripts/test-layout-e2e.mjs
            echo "::endgroup::"
          done

      # The tag comes first and everything downstream is built FROM it.
      #
      # It used to be the other way round: the release was published, then the
      # two platform builds were dispatched against $GITHUB_REF_NAME — the
      # branch — and nobody waited for either. A build that failed left a
      # published release with no download on it, and a push to the branch
      # between dispatch and checkout meant the binaries were not built from
      # the source the tag names. Both are silent.
      #
      # And it has to be retryable. Everything after this point can fail — the
      # platform builds run afterwards — and until 2.0 a failure there left a
      # tag and a draft behind that made every later attempt die at
      # `gh release create` with "release already exists". The 2.0.0 release hit
      # exactly that: the Windows build failed on a CRLF-only test bug, and the
      # only way forward was to delete a tag and a draft by hand. A release
      # process that cannot be retried is one that gets finished by hand, which
      # is the opposite of what it is for.
      #
      # Retrying is allowed only while nothing has been published: a draft for
      # this tag is deleted, a *published* release for it stops the run.
      - name: tag the commit under test
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          notes=".github/release-notes/${TAG}.md"
          test -f "$notes" || { echo "missing $notes"; exit 1; }
          # one page, not --paginate: with --paginate the --jq runs per page and
          # emits one line each, so a two-page repo answers a yes/no question
          # with two lines. 100 is well above this repo's release count.
          rels=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100")
          published=$(printf '%s' "$rels" | jq -r "[.[] | select(.tag_name==\"${TAG}\") | select(.draft==false)] | .[0].id // empty")
          if [ -n "$published" ]; then
            echo "${TAG} is already published — refusing to retag it"
            exit 1
          fi
          draft=$(printf '%s' "$rels" | jq -r "[.[] | select(.tag_name==\"${TAG}\") | select(.draft==true)] | .[0].id // empty")
          if [ -n "$draft" ]; then
            echo "deleting the draft ${TAG} left by a failed attempt (release $draft)"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${draft}"
          fi
          git tag -f "$TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/${TAG}"
      - name: draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "$TAG" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file ".github/release-notes/${TAG}.md"
      - name: build both platforms from the tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          SDK_VERSION: ${{ inputs.sdk_version }}
        run: |
          set -euo pipefail
          # recorded before the dispatch so the wait below can tell this
          # attempt's runs from a previous attempt's
          echo "DISPATCHED_AT=$(date -u -d '-1 minute' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          gh workflow run build-macos.yml --ref "$TAG" \
            -f release_tag="$TAG" -f sdk_version="$SDK_VERSION"
          gh workflow run build-windows.yml --ref "$TAG" \
            -f release_tag="$TAG" -f sdk_version="$SDK_VERSION"
      - name: wait for both builds to upload their assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          DISPATCHED_AT: ${{ env.DISPATCHED_AT }}
        run: |
          set -euo pipefail
          # give the dispatches a moment to register as runs
          sleep 20
          deadline=$(( $(date +%s) + 3600 ))
          for wf in build-macos.yml build-windows.yml; do
            id=""
            while [ -z "$id" ]; do
              # Only runs newer than this attempt's dispatch. On a retry the tag
              # already carries the previous attempt's runs, and "the most
              # recent run for this tag" can still be one of those in the
              # seconds before the new one registers — which would make the
              # retry watch the very run that failed last time and fail again.
              id=$(gh run list --workflow="$wf" --branch "$TAG" --limit 30 \
                     --json databaseId,createdAt \
                     --jq "[.[] | select(.createdAt >= \"${DISPATCHED_AT}\")] | .[0].databaseId // empty")
              [ -n "$id" ] && break
              [ "$(date +%s)" -lt "$deadline" ] || { echo "no $wf run appeared for $TAG"; exit 1; }
              sleep 15
            done
            echo "waiting on $wf run $id"
            gh run watch "$id" --exit-status
          done
      - name: the release must actually have both downloads
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          assets=$(gh release view "$TAG" --json assets --jq '[.assets[].name] | join(" ")')
          echo "assets: $assets"
          case "$assets" in *macOS-arm64.zip*) ;; *) echo "missing the macOS zip"; exit 1;; esac
          case "$assets" in *Windows-x64.zip*) ;; *) echo "missing the Windows zip"; exit 1;; esac
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release edit "$TAG" --draft=false
