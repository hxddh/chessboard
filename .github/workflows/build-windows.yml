name: build-windows

# The Windows app (x64): the same as build-macos.yml — src/app into
# frontend/dist, the Zig shell with the SQLite store, a native Stockfish
# (MinGW-w64 GCC, cached by its build script) beside chessboard.exe, packaged
# by the Native SDK CLI. Two jobs, side by side:
#
#   package    the release build: packaged, the engine added, zipped, and the
#              package as shipped launched in self-test mode twice — once from
#              a folder nobody may write to (where a user's Program Files copy
#              is: WebView2's data must then go to %LOCALAPPDATA%\Chessboard,
#              v8-4-plan V1), once from where it was unpacked. Its zip is the
#              Chessboard-Windows-x64 artifact release.yml publishes.
#   scenarios  the same commit built with -Dautomation=true, never uploaded,
#              driven through the app's scenarios (scripts/automation-app.mjs).
#
# checks.yml runs this workflow on a PR that changes the native side, and
# release.yml runs it (through checks.yml) on every release.
#
# Signing (v20-0-plan §7 E2) is not here yet: the exe and the engine are
# unsigned, so SmartScreen warns. Authenticode signing needs the owner's code
# signing certificate as repository secrets; the step goes where the TODO
# below says, after add-engine.sh and before the zip.

on:
  workflow_dispatch:
    inputs:
      sdk_version:
        description: "@native-sdk/cli version (npm dist-tag or exact version)"
        required: false
        default: "0.11.0"
  workflow_call:
    inputs:
      sdk_version:
        type: string
        required: false
        default: "0.11.0"

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 50
    name: Windows package
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: install build deps
        run: npm ci
      - name: install Native SDK CLI
        env:
          SDK_VERSION: ${{ inputs.sdk_version || '0.11.0' }}
        run: |
          npm install -g "@native-sdk/cli@${SDK_VERSION}"
          native --version || true
          echo "SDK_PATH=$(npm root -g)/@native-sdk/cli" >> "$GITHUB_ENV"
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          # a new key: the caches saved before the cleanup step below can be half-built
          cache-key: e3-clean
      - name: restore Stockfish
        id: sf
        uses: actions/cache/restore@v6
        with:
          path: build/stockfish
          key: stockfish-${{ runner.os }}-x64-${{ hashFiles('scripts/build-stockfish.sh') }}
      - name: MSYS2 (MinGW-w64 GCC) for Stockfish
        if: steps.sf.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc make git
      - name: build Stockfish
        if: steps.sf.outputs.cache-hit != 'true'
        timeout-minutes: 25
        shell: msys2 {0}
        run: scripts/build-stockfish.sh build/stockfish
      - name: cache Stockfish
        if: steps.sf.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: build/stockfish
          key: stockfish-${{ runner.os }}-x64-${{ hashFiles('scripts/build-stockfish.sh') }}
      - name: frontend (src/app → frontend/dist) and its licences
        run: |
          node scripts/sync-dist.mjs
          cp build/stockfish/stockfish-SOURCE.txt build/stockfish/stockfish-AUTHORS.txt frontend/dist/licenses/
      - name: manifest keys are actually read
        run: node scripts/manifest-check.mjs --sdk "$SDK_PATH"
      - name: zig build test
        run: zig build test -Dplatform=windows -Dnative-sdk-path="$SDK_PATH"
      - name: zig build
        run: zig build -Doptimize=ReleaseFast -Dplatform=windows -Dnative-sdk-path="$SDK_PATH"
      - name: package with the engine
        run: |
          mkdir -p dist
          native package --target windows --output dist/Chessboard --binary zig-out/bin/chessboard.exe
          cp scripts/register-pgn.cmd scripts/register-pgn.reg dist/Chessboard/
          cp assets/icon.ico dist/Chessboard/resources/icon.ico
          scripts/add-engine.sh dist/Chessboard build/stockfish
          test -f "$(find dist/Chessboard -path '*/licenses/LICENSE.txt' | head -n1)"
          test -f "$(find dist/Chessboard -path '*/licenses/stockfish-SOURCE.txt' | head -n1)"
          echo "package: $(du -sk dist/Chessboard | cut -f1) KiB"
      # TODO(v20-0-plan E2): Authenticode-sign chessboard.exe and
      # stockfish.exe (signtool sign /fd SHA256 /tr <timestamp server>) once
      # the owner's code signing certificate is a repository secret; until then
      # the package is unsigned.
      - name: self-test the package as shipped, from a read-only folder
        timeout-minutes: 8
        shell: pwsh
        run: |
          $ro = Join-Path $env:RUNNER_TEMP 'readonly-app\Chessboard'
          New-Item -ItemType Directory -Force (Split-Path $ro) | Out-Null
          Copy-Item -Recurse -Force 'dist/Chessboard' $ro
          Get-ChildItem -Recurse -Directory -Filter '*.WebView2' $ro | Remove-Item -Recurse -Force
          $fallback = Join-Path $env:LOCALAPPDATA 'Chessboard\WebView2'
          if (Test-Path $fallback) { Remove-Item -Recurse -Force $fallback }
          icacls $ro /deny "*S-1-1-0:(OI)(CI)(WD,AD)" /T /C
          if ($LASTEXITCODE -ne 0) { throw "icacls failed ($LASTEXITCODE)" }
          $exe = (Get-ChildItem -Recurse -Filter chessboard.exe $ro | Select-Object -First 1).FullName
          $bin = Split-Path $exe
          $probe = Join-Path $bin 'write-probe.txt'
          $wrote = $true
          try { [IO.File]::WriteAllText($probe, 'x') } catch { $wrote = $false }
          if ($wrote) { throw "the deny did not take: $probe could be written" }
          node scripts/automation-app.mjs $exe --only smoke
          if ($LASTEXITCODE -ne 0) { throw "the self-test from the read-only folder failed ($LASTEXITCODE)" }
          $beside = Get-ChildItem -Directory -Filter '*.WebView2' $bin
          if ($beside) { throw "WebView2 data beside the exe: $($beside.FullName -join ', ')" }
          if (-not (Get-ChildItem -Force $fallback -ErrorAction SilentlyContinue)) { throw "no WebView2 data in $fallback" }
          Write-Host "ok: WebView2 data went to $fallback"
      - name: self-test the package as shipped
        timeout-minutes: 8
        run: node scripts/automation-app.mjs "$(find dist/Chessboard -name chessboard.exe | head -n1)" --only smoke
      - name: zip
        shell: pwsh
        run: Compress-Archive -Path 'dist/Chessboard' -DestinationPath 'dist/Chessboard-Windows-x64.zip' -Force
      - uses: actions/upload-artifact@v7
        with:
          name: Chessboard-Windows-x64
          path: dist/Chessboard-Windows-x64.zip
      # setup-zig saves .zig-cache in its post step even for a cancelled or
      # failed job: a build cut off mid-way left a cache whose manifests name
      # outputs it never wrote (zig (windows-2025) on 1bfc29f: native-sdk.manifest.res
      # missing, restored from run 42336843004, cancelled mid-build by a push).
      # Such a job saves an empty cache instead; the next one builds cold.
      - name: no half-built zig cache for the next run
        if: cancelled() || failure()
        shell: bash
        run: rm -rf .zig-cache

  scenarios:
    runs-on: windows-2025
    timeout-minutes: 50
    name: Windows scenarios (automation build, not released)
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: install build deps
        run: npm ci
      - name: install Native SDK CLI
        env:
          SDK_VERSION: ${{ inputs.sdk_version || '0.11.0' }}
        run: |
          npm install -g "@native-sdk/cli@${SDK_VERSION}"
          echo "SDK_PATH=$(npm root -g)/@native-sdk/cli" >> "$GITHUB_ENV"
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          # a new key: the caches saved before the cleanup step below can be half-built
          cache-key: e3-clean
      - name: restore Stockfish
        id: sf
        uses: actions/cache/restore@v6
        with:
          path: build/stockfish
          key: stockfish-${{ runner.os }}-x64-${{ hashFiles('scripts/build-stockfish.sh') }}
      - name: MSYS2 (MinGW-w64 GCC) for Stockfish
        if: steps.sf.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc make git
      - name: build Stockfish
        if: steps.sf.outputs.cache-hit != 'true'
        timeout-minutes: 25
        shell: msys2 {0}
        run: scripts/build-stockfish.sh build/stockfish
      - name: frontend (src/app → frontend/dist) and its licences
        run: |
          node scripts/sync-dist.mjs
          cp build/stockfish/stockfish-SOURCE.txt build/stockfish/stockfish-AUTHORS.txt frontend/dist/licenses/
      - name: zig build (automation)
        run: zig build -Doptimize=ReleaseFast -Dautomation=true -Dplatform=windows -Dnative-sdk-path="$SDK_PATH" --prefix zig-out-auto
      - name: package (automation build, never uploaded)
        run: |
          native package --target windows --output dist-auto/Chessboard --binary zig-out-auto/bin/chessboard.exe
          cp assets/icon.ico dist-auto/Chessboard/resources/icon.ico
          scripts/add-engine.sh dist-auto/Chessboard build/stockfish
          echo "AUTO_EXE=$(find dist-auto/Chessboard -name chessboard.exe | head -n1)" >> "$GITHUB_ENV"
      - name: the app's scenarios
        timeout-minutes: 25
        run: node scripts/automation-app.mjs "$AUTO_EXE" --out automation-app-windows.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: app-report-Windows
          path: automation-app-windows.json
          if-no-files-found: ignore
      # setup-zig saves .zig-cache in its post step even for a cancelled or
      # failed job: a build cut off mid-way left a cache whose manifests name
      # outputs it never wrote (zig (windows-2025) on 1bfc29f: native-sdk.manifest.res
      # missing, restored from run 42336843004, cancelled mid-build by a push).
      # Such a job saves an empty cache instead; the next one builds cold.
      - name: no half-built zig cache for the next run
        if: cancelled() || failure()
        shell: bash
        run: rm -rf .zig-cache
