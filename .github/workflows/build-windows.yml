name: build-windows

# Builds chessboard.exe (x64) on a Windows runner using the system web engine
# (Microsoft Edge WebView2, preinstalled on windows-latest). Native SDK comes
# from npm (@native-sdk/cli), zig from ziglang.org. Optionally uploads the zip
# to an existing release when release_tag is set. Exploratory: this is the
# first non-macOS target — CI is the source of truth for whether it builds.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to upload the zip to (optional)"
        required: false
        default: ""
      sdk_version:
        # Pinned, like release.yml's input of the same name (see the comment
        # there). D7: this used to default to "latest", and the `|| '0.10.1'`
        # below only catches an EMPTY string — so every hand-dispatched build
        # got whatever npm had that day, while the step's comment claimed the
        # opposite. The fallback stays for a caller that passes "".
        description: "@native-sdk/cli version (npm dist-tag or exact version)"
        required: false
        default: "0.10.1"
  # 22.0 G6′: a pull request that changes the shell, the packaging or the
  # real-WebView scenarios runs this workflow — both jobs, the automation one
  # with its 13 pages in a real WebView. Through 21.0 the first real WebView a
  # change met was the release's own run. No tag: nothing is uploaded anywhere.
  pull_request:
    paths:
      - "src/**/*.zig"
      - "src/native/**"
      - "build.zig"
      - "build.zig.zon"
      - "app.zon"
      - "scripts/automation-scenarios.mjs"
      - "scripts/lib/automation.mjs"
      - "scripts/selftest-app.mjs"
      - "src/web/js/selftest-scenarios.js"
      - ".github/workflows/build-windows.yml"
  # 7.6: called by release.yml in parallel with its test jobs — see the same
  # trigger in build-macos.yml.
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: false
        default: ""
      sdk_version:
        type: string
        required: false
        default: "0.10.1"

# 22.0 D1: read by default. Only `build` may write — it is the one job that
# uploads to a release (and only when release_tag is set); `automation` runs a
# third-party setup action and a global npm install and needs no token that
# can write.
permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      # esbuild, and nothing else. It bundles the ES modules under src/web/js
      # into the one classic script zero:// can load; `npm ci` rather than
      # `npm install` so the same commit gets the same bundler.
      - name: install build deps
        run: npm ci
      - name: unit tests
        run: node scripts/test-chess.mjs
      # The SDK version is an input rather than a bare `npm install -g`, so a
      # release can pin it and get the same toolchain twice. Whatever it
      # resolves to is echoed into the log: an unrecorded dependency is one
      # that cannot be blamed later.
      - name: install Native SDK CLI
        shell: bash
        env:
          # see release.yml's sdk_version input for why this is not 'latest'
          SDK_VERSION: ${{ inputs.sdk_version || '0.10.1' }}
        run: |
          npm install -g "@native-sdk/cli@${SDK_VERSION}"
          native --version || true
          echo "resolved: $(npm ls -g --depth=0 @native-sdk/cli || true)"
          echo "SDK_PATH=$(npm root -g)/@native-sdk/cli" >> "$GITHUB_ENV"
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: sync frontend dist
        shell: bash
        run: |
          # One script, not a hand-copied list. 6.1 added an on-demand chunk
          # (chunk-eco.js) to the bundler and to sync-dist.mjs, and these
          # workflow copies kept naming two files — the packaged app would
          # have shipped without it and lost every opening name. The list
          # lives in scripts/bundle.mjs CHUNKS and is read, never retyped.
          node scripts/sync-dist.mjs
      - name: manifest keys are actually read
        # src/runner.zig is a fork of the SDK's app_runner and does not
        # complain when it lags: an unread key silently takes the SDK
        # default. That is how close_policy = "hide" shipped dead in 1.18.
        shell: bash
        run: node scripts/manifest-check.mjs --sdk "$SDK_PATH"
      # src/main.zig has carried `test` blocks since 1.21.2 and nothing has ever
      # run them — `zig build test` exists in build.zig and no workflow, and no
      # script, called it. That includes the guard written for the JSON
      # unescaping fix, which shipped in two releases described as guarded.
      #
      # It is worse than an unrun test: Zig only analyses a `test` block when
      # building tests, so one that does not even compile leaves `zig build`
      # perfectly green. This step is the first time these are known to work.
      #
      # It lives here rather than in checks.yml because the test module imports
      # the Native SDK, which only the platform runners have.
      - name: zig build test
        shell: bash
        run: zig build test -Dplatform=windows -Dnative-sdk-path="$SDK_PATH"
      - name: zig build
        shell: bash
        run: zig build -Doptimize=ReleaseFast -Dplatform=windows -Dnative-sdk-path="$SDK_PATH"
      - name: package + zip
        shell: bash
        run: |
          mkdir -p dist
          native package --target windows --output dist/Chessboard --binary zig-out/bin/chessboard.exe
          # 22.0 D2: no folder, no package. Every step below used to fall back
          # to the bare exe when this was missing, so a release could have
          # shipped an exe with no resources beside it and stayed green.
          test -d dist/Chessboard/resources
          # .pgn association: Windows has no bundle manifest for it and the
          # packager writes no registry entries, so the one-time registration
          # script rides next to the exe (see scripts/register-pgn.cmd)
          if [ -d dist/Chessboard ]; then
            cp scripts/register-pgn.cmd scripts/register-pgn.reg dist/Chessboard/
            # the notification icon main.zig hands the host (v8-3-plan V2):
            # LoadImageW(IMAGE_ICON) wants an .ico, by an absolute path
            cp assets/icon.ico dist/Chessboard/resources/icon.ico
            test -f "$(find dist/Chessboard -path '*/licenses/LICENSE.txt' | head -n1)"
          fi
          ls -R dist
      # v8-4-plan V1: the packaged app in a folder the user cannot write to,
      # as when it is unzipped into Program Files. A copy of dist/Chessboard
      # (taken before the self-test below has run it, so it holds no
      # chessboard.exe.WebView2 folder yet) gets a deny ACE for Everyone:
      # (OI)(CI)(WD,AD) — "create files / write data" and "create
      # folders / append data", inherited by everything under it. That is
      # what makes creating a file fail; reading, listing and running the exe
      # are untouched (no full W: W includes SYNCHRONIZE, which opening a
      # folder needs). The step proves the deny took (a write must fail),
      # runs the same two-launch self-test there, and then wants WebView2's
      # data in %LOCALAPPDATA%\Chessboard\WebView2 and none beside the exe.
      # Red on purpose: comment out `app_state.resolveWebView2UserData();` in
      # src/main.zig main() — then WebView2 has no folder it may write, and
      # even if the page came up anyway the %LOCALAPPDATA% check fails.
      - name: self-test the packaged app from a read-only folder
        timeout-minutes: 6
        shell: pwsh
        run: |
          $src = if (Test-Path 'dist/Chessboard') { 'dist/Chessboard' } else { throw 'no dist/Chessboard to copy' }
          $ro = Join-Path $env:RUNNER_TEMP 'readonly-app\Chessboard'
          New-Item -ItemType Directory -Force (Split-Path $ro) | Out-Null
          Copy-Item -Recurse -Force $src $ro
          Get-ChildItem -Recurse -Directory -Filter '*.WebView2' $ro | Remove-Item -Recurse -Force
          $fallback = Join-Path $env:LOCALAPPDATA 'Chessboard\WebView2'
          if (Test-Path $fallback) { Remove-Item -Recurse -Force $fallback }
          # Everyone (S-1-1-0), not just $env:USERNAME: on the first CI run a
          # deny for the user alone did not stop the write. /T writes the ACE
          # on every folder and file, so it does not rely on propagation.
          icacls $ro /deny "*S-1-1-0:(OI)(CI)(WD,AD)" /T /C
          if ($LASTEXITCODE -ne 0) { throw "icacls failed ($LASTEXITCODE)" }
          $exe = (Get-ChildItem -Recurse -Filter chessboard.exe $ro | Select-Object -First 1).FullName
          $bin = Split-Path $exe
          icacls $bin
          $probe = Join-Path $bin 'write-probe.txt'
          $wrote = $true
          try { [IO.File]::WriteAllText($probe, 'x') } catch { $wrote = $false }
          if ($wrote) { throw "the deny did not take: $probe could be written" }
          Write-Host "ok: $bin refuses new files"
          node scripts/selftest-app.mjs $exe
          if ($LASTEXITCODE -ne 0) { throw "self-test from the read-only folder failed ($LASTEXITCODE)" }
          $beside = Get-ChildItem -Directory -Filter '*.WebView2' $bin
          if ($beside) { throw "WebView2 data beside the exe: $($beside.FullName -join ', ')" }
          if (-not (Get-ChildItem -Force $fallback -ErrorAction SilentlyContinue)) { throw "no WebView2 data in $fallback" }
          Write-Host "ok: WebView2 data went to $fallback"
      # 7.5: launch the packaged app once before shipping it — see the same
      # step in build-macos.yml and scripts/selftest-app.mjs (v8-1-plan N3 adds
      # IndexedDB, the synchronous language chunks and the native file commands).
      - name: self-test the packaged app
        shell: bash
        run: |
          exe="$(find dist/Chessboard -name chessboard.exe | head -n1)"
          [ -n "$exe" ] || { echo "no chessboard.exe under dist/Chessboard"; exit 1; }
          node scripts/selftest-app.mjs "$exe"
      - name: zip package
        shell: pwsh
        run: |
          # 22.0 D2: the packaged folder, or nothing (it was "or a bare exe")
          if (-not (Test-Path 'dist/Chessboard')) { throw 'dist/Chessboard is missing' }
          Compress-Archive -Path 'dist/Chessboard' -DestinationPath 'dist/Chessboard-Windows-x64.zip' -Force
          Get-ChildItem dist
      - uses: actions/upload-artifact@v7
        with:
          name: Chessboard-Windows-x64
          path: dist/Chessboard-Windows-x64.zip
      - name: upload to release
        if: ${{ inputs.release_tag != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: gh release upload "$TAG" dist/Chessboard-Windows-x64.zip --clobber

  # v8-2-plan V1 step 2: the automation build, driven from outside — see the
  # same job in build-macos.yml for what it is and why it is never released
  # (scripts/test-chess.mjs holds that it produces no Chessboard-* artifact).
  #
  # A gate since 8.3 (v8-3-plan §8 第 4 条): release.yml's publish needs this
  # whole workflow, so a red here stops a release, as on macOS. Until 8.2.1
  # it was not: the page never ran on a runner, because the WebView2 host
  # read it from the current directory (v8-2-plan §9 「8.2.1」); with that
  # fixed it went green twice in a row (runs 37571031877, 37573325903).
  # The smoke and scenario steps carry their own limits under the job's, so
  # a hang ends a step "failed" with its report, not the job "cancelled".
  #
  # 21.0 G1: and the real-WebView gate. 20.0 passed every job here and was
  # broken on real machines, because these checks asked whether elements and
  # marks existed and never looked at the screen. The `pages` scenario walks
  # every main page and has the page judge it drawn (the stylesheet applies,
  # the rail and buttons have boxes, nothing in the main column is squashed
  # to no width, the board canvas holds pixels, no uncaught error), and the
  # driver screenshots the real window at each page into webview-shots/,
  # uploaded as webview-shots-<os> whatever the result, for a person (or
  # Claude) to look at before a release. Any judgement or missing shot is red.
  # 25 minutes, not 20: the walk holds thirteen pages 5 s each and reviews a
  # game with the real engine.
  automation:
    runs-on: windows-2025
    timeout-minutes: 25
    name: automation (not released)
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: install build deps
        run: npm ci
      - name: install Native SDK CLI
        env:
          SDK_VERSION: ${{ inputs.sdk_version || '0.10.1' }}
        run: |
          npm install -g "@native-sdk/cli@${SDK_VERSION}"
          echo "resolved: $(npm ls -g --depth=0 @native-sdk/cli || true)"
          echo "SDK_PATH=$(npm root -g)/@native-sdk/cli" >> "$GITHUB_ENV"
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: sync frontend dist
        run: node scripts/sync-dist.mjs
      - name: zig build (automation)
        run: zig build -Doptimize=ReleaseFast -Dautomation=true -Dplatform=windows -Dnative-sdk-path="$SDK_PATH" --prefix zig-out-auto
      - name: package (automation build, never uploaded)
        run: |
          native package --target windows --output dist-auto/Chessboard --binary zig-out-auto/bin/chessboard.exe
          exe="$(find dist-auto/Chessboard -name chessboard.exe | head -n1)"
          [ -n "$exe" ] || exe=zig-out-auto/bin/chessboard.exe
          echo "AUTO_EXE=$exe" >> "$GITHUB_ENV"
      - name: automation smoke
        timeout-minutes: 3
        run: node scripts/automation-smoke.mjs "$AUTO_EXE"
      # 21.0 G1: the scenarios end with every main page judged and photographed
      - name: automation scenarios
        timeout-minutes: 17
        run: node scripts/automation-scenarios.mjs "$AUTO_EXE" --out automation-windows.json --shots webview-shots
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: automation-report-Windows
          path: automation-windows.json
          if-no-files-found: ignore
      # 21.0 G1: the real WebView2's pages — see build-macos.yml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: webview-shots-windows
          path: webview-shots/
          if-no-files-found: warn
