name: build-windows

# Builds chessboard.exe (x64) on a Windows runner using the system web engine
# (Microsoft Edge WebView2, preinstalled on windows-latest). Native SDK comes
# from npm (@native-sdk/cli), zig from ziglang.org. Optionally uploads the zip
# to an existing release when release_tag is set. Exploratory: this is the
# first non-macOS target — CI is the source of truth for whether it builds.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to upload the zip to (optional)"
        required: false
        default: ""
      sdk_version:
        description: "@native-sdk/cli version (npm dist-tag or exact version)"
        required: false
        default: "latest"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # esbuild, and nothing else. It bundles the ES modules under src/web/js
      # into the one classic script zero:// can load; `npm ci` rather than
      # `npm install` so the same commit gets the same bundler.
      - name: install build deps
        run: npm ci
      - name: unit tests
        run: node scripts/test-chess.mjs
      # The SDK version is an input rather than a bare `npm install -g`, so a
      # release can pin it and get the same toolchain twice. Whatever it
      # resolves to is echoed into the log: an unrecorded dependency is one
      # that cannot be blamed later.
      - name: install Native SDK CLI
        shell: bash
        env:
          # see release.yml's sdk_version input for why this is not 'latest'
          SDK_VERSION: ${{ inputs.sdk_version || '0.8.1' }}
        run: |
          npm install -g "@native-sdk/cli@${SDK_VERSION}"
          native --version || true
          echo "resolved: $(npm ls -g --depth=0 @native-sdk/cli || true)"
          echo "SDK_PATH=$(npm root -g)/@native-sdk/cli" >> "$GITHUB_ENV"
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: sync frontend dist
        shell: bash
        run: |
          node scripts/gen-engine-src.mjs
          node scripts/bundle.mjs
          rm -rf frontend/dist && mkdir -p frontend/dist/js
          cp src/web/index.html src/web/styles.css frontend/dist/
          # only the two generated scripts ship — index.html loads exactly
          # these, and the module sources are build inputs, not product
          cp src/web/js/bundle.js src/web/js/engine-src.js frontend/dist/js/
          test "$(wc -c < frontend/dist/js/bundle.js)" -gt 400000
          # engine-src must carry the full wasm payload (~9MB), not a stub
          test "$(wc -c < frontend/dist/js/engine-src.js)" -gt 5000000
      - name: manifest keys are actually read
        # src/runner.zig is a fork of the SDK's app_runner and does not
        # complain when it lags: an unread key silently takes the SDK
        # default. That is how close_policy = "hide" shipped dead in 1.18.
        shell: bash
        run: node scripts/manifest-check.mjs --sdk "$SDK_PATH"
      # src/main.zig has carried `test` blocks since 1.21.2 and nothing has ever
      # run them — `zig build test` exists in build.zig and no workflow, and no
      # script, called it. That includes the guard written for the JSON
      # unescaping fix, which shipped in two releases described as guarded.
      #
      # It is worse than an unrun test: Zig only analyses a `test` block when
      # building tests, so one that does not even compile leaves `zig build`
      # perfectly green. This step is the first time these are known to work.
      #
      # It lives here rather than in checks.yml because the test module imports
      # the Native SDK, which only the platform runners have.
      - name: zig build test
        shell: bash
        run: zig build test -Dplatform=windows -Dnative-sdk-path="$SDK_PATH"
      - name: zig build
        shell: bash
        run: zig build -Doptimize=ReleaseFast -Dplatform=windows -Dnative-sdk-path="$SDK_PATH"
      - name: package + zip
        shell: bash
        run: |
          mkdir -p dist
          native package --target windows --output dist/Chessboard --binary zig-out/bin/chessboard.exe
          ls -R dist
      - name: zip package
        shell: pwsh
        run: |
          # Zip whatever native package produced under dist/ (a folder or a bare exe).
          $src = if (Test-Path 'dist/Chessboard') { 'dist/Chessboard' } else { 'zig-out/bin/chessboard.exe' }
          Compress-Archive -Path $src -DestinationPath 'dist/Chessboard-Windows-x64.zip' -Force
          Get-ChildItem dist
      - uses: actions/upload-artifact@v4
        with:
          name: Chessboard-Windows-x64
          path: dist/Chessboard-Windows-x64.zip
      - name: upload to release
        if: ${{ inputs.release_tag != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: gh release upload "$TAG" dist/Chessboard-Windows-x64.zip --clobber
