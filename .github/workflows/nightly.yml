name: nightly

# Once a day on main: are the pinned versions behind upstream (the SDK, Zig,
# Node, Playwright, the actions, esbuild — scripts/deps-check.mjs)? A report,
# never a failure: raising a pin is a person's change, which test-deps.mjs
# then holds docs/deps-inventory.json to.
on:
  schedule:
    # 03:20 UTC. Not on the hour: a cron shared with everyone else's cron is
    # a cron that queues.
    - cron: "20 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deps:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: newer upstream versions (report only)
        run: node scripts/deps-check.mjs
