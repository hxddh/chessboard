name: build-macos

# Builds Chessboard.app (arm64, adhoc-signed) on a macOS runner: Native SDK comes
# from npm (@native-sdk/cli), zig from ziglang.org. Optionally uploads the
# zip to an existing release when release_tag is set.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to upload the zip to (optional)"
        required: false
        default: ""
      sdk_version:
        # Pinned, like release.yml's input of the same name (see the comment
        # there). D7: this used to default to "latest", and the `|| '0.8.1'`
        # below only catches an EMPTY string — so every hand-dispatched build
        # got whatever npm had that day, while the step's comment claimed the
        # opposite. The fallback stays for a caller that passes "".
        description: "@native-sdk/cli version (npm dist-tag or exact version)"
        required: false
        default: "0.8.1"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # esbuild, and nothing else. It bundles the ES modules under src/web/js
      # into the one classic script zero:// can load; `npm ci` rather than
      # `npm install` so the same commit gets the same bundler.
      - name: install build deps
        run: npm ci
      - name: unit tests
        run: node scripts/test-chess.mjs
      # The SDK version is an input rather than a bare `npm install -g`, so a
      # release can pin it and get the same toolchain twice. Whatever it
      # resolves to is echoed into the log: an unrecorded dependency is one
      # that cannot be blamed later.
      - name: install Native SDK CLI
        env:
          # see release.yml's sdk_version input for why this is not 'latest'
          SDK_VERSION: ${{ inputs.sdk_version || '0.8.1' }}
        run: |
          npm install -g "@native-sdk/cli@${SDK_VERSION}"
          native --version || true
          echo "resolved: $(npm ls -g --depth=0 @native-sdk/cli || true)"
          echo "SDK_PATH=$(npm root -g)/@native-sdk/cli" >> "$GITHUB_ENV"
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: sync frontend dist
        run: |
          # One script, not a hand-copied list. 6.1 added an on-demand chunk
          # (chunk-eco.js) to the bundler and to sync-dist.mjs, and these
          # workflow copies kept naming two files — the packaged app would
          # have shipped without it and lost every opening name. The list
          # lives in scripts/bundle.mjs CHUNKS and is read, never retyped.
          node scripts/sync-dist.mjs
      - name: derive the macOS manifest
        # close_policy = "hide" is macOS-only: on windows it is a comptime
        # error without a tray, and app.zon has to stay portable. (The dev-
        # server origin app.zon lists is dropped by src/runner.zig in every
        # non-Debug exe — D6 — not by this step: the derived manifest stays
        # app.zon plus exactly the close policy.)
        run: node scripts/gen-manifest.mjs macos
      - name: manifest keys are actually read
        # src/runner.zig is a fork of the SDK's app_runner and does not
        # complain when it lags: an unread key silently takes the SDK
        # default. That is how close_policy = "hide" shipped dead in 1.18.
        run: node scripts/manifest-check.mjs --sdk "$SDK_PATH"
      # src/main.zig has carried `test` blocks since 1.21.2 and nothing has ever
      # run them — `zig build test` exists in build.zig and no workflow, and no
      # script, called it. That includes the guard written for the JSON
      # unescaping fix, which shipped in two releases described as guarded.
      #
      # It is worse than an unrun test: Zig only analyses a `test` block when
      # building tests, so one that does not even compile leaves `zig build`
      # perfectly green. This step is the first time these are known to work.
      #
      # It lives here rather than in checks.yml because the test module imports
      # the Native SDK, which only the platform runners have.
      - name: zig build test
        run: zig build test -Dmanifest=build/app.macos.zon -Dnative-sdk-path="$SDK_PATH"
      - name: zig build
        run: zig build -Doptimize=ReleaseFast -Dmanifest=build/app.macos.zon -Dnative-sdk-path="$SDK_PATH"
      - name: package .app + zip
        run: |
          mkdir -p dist
          native package --target macos --signing adhoc --manifest build/app.macos.zon --output dist/Chessboard.app --binary zig-out/bin/chessboard
          # .pgn document type (Info.plist) — a plist edit after packaging,
          # re-signed adhoc; see the script for why it is not an app.zon key
          scripts/add-pgn-doctype.sh dist/Chessboard.app
          # the licences made it into the bundle next to index.html
          test -f "$(find dist/Chessboard.app -path '*/licenses/LICENSE.txt' | head -n1)"
          ditto -c -k --sequesterRsrc --keepParent dist/Chessboard.app dist/Chessboard-macOS-arm64.zip
          # 6.0: a disk image beside the zip — the shape Mac users expect to
          # drag into Applications. Unsigned like the zip (v6-plan Q1.5 minus
          # the Developer ID part, which is out of scope for this release);
          # the Gatekeeper right-click-open dance is the same for both.
          hdiutil create -volname Chessboard -srcfolder dist/Chessboard.app -ov -format UDZO dist/Chessboard-macOS-arm64.dmg
          ls -lh dist
      - uses: actions/upload-artifact@v7
        with:
          name: Chessboard-macOS-arm64
          path: |
            dist/Chessboard-macOS-arm64.zip
            dist/Chessboard-macOS-arm64.dmg
      - name: upload to release
        if: ${{ inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: gh release upload "$TAG" dist/Chessboard-macOS-arm64.zip dist/Chessboard-macOS-arm64.dmg --clobber
