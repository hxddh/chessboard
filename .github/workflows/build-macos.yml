name: build-macos

# The macOS app (arm64): src/app built into frontend/dist (scripts/sync-dist.mjs),
# the Zig shell with the SDK's SQLite store, a native Stockfish beside the
# executable (scripts/build-stockfish.sh, cached by its script), packaged by
# the Native SDK CLI. Two jobs, side by side:
#
#   package    the release build: packaged, the engine added, a zip and a
#              DMG, and the package as shipped launched once in self-test mode
#              (CHESS_SELFTEST=1: board drawn, native db and native engine
#              answer — scripts/automation-app.mjs --only smoke). Its zip and
#              DMG are the Chessboard-macOS-arm64 artifact release.yml publishes.
#   scenarios  the same commit built with -Dautomation=true (the SDK's
#              automation server: a file dropbox any local process could drive,
#              so this package is never uploaded) and driven from outside:
#              a move written and found again after a restart, the db and engine contracts in the
#              app, a 60-ply review, a killed engine survived, no engine left
#              running (scripts/automation-app.mjs).
#
# checks.yml runs this workflow on a PR that changes the native side, and
# release.yml runs it (through checks.yml) on every release.
#
# Signing (v20-0-plan §7 E2) is not here yet: the package is ad-hoc signed.
# Developer ID signing and notarization need the owner's certificate and an
# App Store Connect key as repository secrets; the step goes where the TODO
# below says, after add-engine.sh (which signs the engine on its own first)
# and before the zip and the DMG are made.

on:
  workflow_dispatch:
    inputs:
      sdk_version:
        description: "@native-sdk/cli version (npm dist-tag or exact version)"
        required: false
        default: "0.11.0"
  workflow_call:
    inputs:
      sdk_version:
        type: string
        required: false
        default: "0.11.0"

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 45
    name: macOS package
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: install build deps
        run: npm ci
      - name: install Native SDK CLI
        env:
          SDK_VERSION: ${{ inputs.sdk_version || '0.11.0' }}
        run: |
          npm install -g "@native-sdk/cli@${SDK_VERSION}"
          native --version || true
          echo "SDK_PATH=$(npm root -g)/@native-sdk/cli" >> "$GITHUB_ENV"
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          # a new key: the caches saved before the cleanup step below can be half-built
          cache-key: e3-clean
      - name: restore Stockfish
        id: sf
        uses: actions/cache/restore@v6
        with:
          path: build/stockfish
          key: stockfish-${{ runner.os }}-arm64-${{ hashFiles('scripts/build-stockfish.sh') }}
      - name: build Stockfish
        if: steps.sf.outputs.cache-hit != 'true'
        timeout-minutes: 20
        run: scripts/build-stockfish.sh build/stockfish
      - name: cache Stockfish
        if: steps.sf.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: build/stockfish
          key: stockfish-${{ runner.os }}-arm64-${{ hashFiles('scripts/build-stockfish.sh') }}
      - name: frontend (src/app → frontend/dist) and its licences
        run: |
          node scripts/sync-dist.mjs
          cp build/stockfish/stockfish-SOURCE.txt build/stockfish/stockfish-AUTHORS.txt frontend/dist/licenses/
      - name: derive the macOS manifest
        run: node scripts/gen-manifest.mjs macos
      - name: manifest keys are actually read
        run: node scripts/manifest-check.mjs --sdk "$SDK_PATH"
      - name: zig build test
        run: zig build test -Dmanifest=build/app.macos.zon -Dnative-sdk-path="$SDK_PATH"
      - name: zig build
        run: zig build -Doptimize=ReleaseFast -Dmanifest=build/app.macos.zon -Dnative-sdk-path="$SDK_PATH"
      - name: package .app with the engine
        run: |
          mkdir -p dist
          native package --target macos --signing adhoc --manifest build/app.macos.zon --output dist/Chessboard.app --binary zig-out/bin/chessboard
          scripts/add-pgn-doctype.sh dist/Chessboard.app
          scripts/add-engine.sh dist/Chessboard.app build/stockfish
          test -f "$(find dist/Chessboard.app -path '*/licenses/LICENSE.txt' | head -n1)"
          test -f "$(find dist/Chessboard.app -path '*/licenses/stockfish-SOURCE.txt' | head -n1)"
          echo "package: $(du -sk dist/Chessboard.app | cut -f1) KiB"
      # TODO(v20-0-plan E2): Developer ID signing and notarization, once the
      # owner's certificate and notary key are repository secrets — codesign
      # --options runtime --timestamp (the engine first, then the bundle),
      # `xcrun notarytool submit --wait`, `xcrun stapler staple`. Until then
      # the package stays ad-hoc signed (above) and Gatekeeper asks.
      - name: zip + DMG
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/Chessboard.app dist/Chessboard-macOS-arm64.zip
          hdiutil create -volname Chessboard -srcfolder dist/Chessboard.app -ov -format UDZO dist/Chessboard-macOS-arm64.dmg
          ls -lh dist
      - name: self-test the package as shipped
        timeout-minutes: 8
        run: node scripts/automation-app.mjs dist/Chessboard.app/Contents/MacOS/chessboard --only smoke
      - uses: actions/upload-artifact@v7
        with:
          name: Chessboard-macOS-arm64
          path: |
            dist/Chessboard-macOS-arm64.zip
            dist/Chessboard-macOS-arm64.dmg
      # setup-zig saves .zig-cache in its post step even for a cancelled or
      # failed job: a build cut off mid-way left a cache whose manifests name
      # outputs it never wrote (zig (windows-2025) on 1bfc29f: native-sdk.manifest.res
      # missing, restored from run 42336843004, cancelled mid-build by a push).
      # Such a job saves an empty cache instead; the next one builds cold.
      - name: no half-built zig cache for the next run
        if: cancelled() || failure()
        shell: bash
        run: rm -rf .zig-cache

  scenarios:
    runs-on: macos-26
    timeout-minutes: 45
    name: macOS scenarios (automation build, not released)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: install build deps
        run: npm ci
      - name: install Native SDK CLI
        env:
          SDK_VERSION: ${{ inputs.sdk_version || '0.11.0' }}
        run: |
          npm install -g "@native-sdk/cli@${SDK_VERSION}"
          echo "SDK_PATH=$(npm root -g)/@native-sdk/cli" >> "$GITHUB_ENV"
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          # a new key: the caches saved before the cleanup step below can be half-built
          cache-key: e3-clean
      - name: restore Stockfish
        id: sf
        uses: actions/cache/restore@v6
        with:
          path: build/stockfish
          key: stockfish-${{ runner.os }}-arm64-${{ hashFiles('scripts/build-stockfish.sh') }}
      - name: build Stockfish
        if: steps.sf.outputs.cache-hit != 'true'
        timeout-minutes: 20
        run: scripts/build-stockfish.sh build/stockfish
      - name: frontend (src/app → frontend/dist) and its licences
        run: |
          node scripts/sync-dist.mjs
          cp build/stockfish/stockfish-SOURCE.txt build/stockfish/stockfish-AUTHORS.txt frontend/dist/licenses/
      - name: derive the macOS manifest
        run: node scripts/gen-manifest.mjs macos
      - name: zig build (automation)
        run: zig build -Doptimize=ReleaseFast -Dautomation=true -Dmanifest=build/app.macos.zon -Dnative-sdk-path="$SDK_PATH" --prefix zig-out-auto
      - name: package (automation build, never uploaded)
        run: |
          native package --target macos --signing adhoc --manifest build/app.macos.zon --output dist-auto/Chessboard.app --binary zig-out-auto/bin/chessboard
          scripts/add-pgn-doctype.sh dist-auto/Chessboard.app
          scripts/add-engine.sh dist-auto/Chessboard.app build/stockfish
          echo "AUTO_EXE=dist-auto/Chessboard.app/Contents/MacOS/chessboard" >> "$GITHUB_ENV"
      - name: the app's scenarios
        timeout-minutes: 25
        run: node scripts/automation-app.mjs "$AUTO_EXE" --out automation-app-macos.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: app-report-macOS
          path: automation-app-macos.json
          if-no-files-found: ignore
      # setup-zig saves .zig-cache in its post step even for a cancelled or
      # failed job: a build cut off mid-way left a cache whose manifests name
      # outputs it never wrote (zig (windows-2025) on 1bfc29f: native-sdk.manifest.res
      # missing, restored from run 42336843004, cancelled mid-build by a push).
      # Such a job saves an empty cache instead; the next one builds cold.
      - name: no half-built zig cache for the next run
        if: cancelled() || failure()
        shell: bash
        run: rm -rf .zig-cache
