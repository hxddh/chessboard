name: checks

# Everything that can be checked on every push and every PR — and, since 6.0,
# the one thing that needs zig and the Native SDK too (the `zig` job below).
#
# Until now the repo had no PR-time CI at all: the only workflows were the two
# platform builds and the release. That meant the checks which do exist ran
# either on a developer's machine or at release time — the two moments where
# "it was already broken before I got here" is hardest to tell.
#
# The browser checks run twice, once per engine. The app ships no browser: on
# Windows the page runs in WebView2, which is Chromium, and on macOS in
# WKWebView, which is WebKit. One engine is a stand-in for half the product.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    # Three platforms, not one. The 5.0.0 lockfile installed only on the Linux
    # runner that generated it — the README's first command failed on every
    # Mac and Windows checkout, and CI was green because CI was that runner.
    # The unit tests themselves are platform-independent; what this matrix
    # proves is that a clean checkout installs where the app is actually built.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # esbuild, and nothing else. It bundles the ES modules under src/web/js
      # into the one classic script zero:// can load; `npm ci` rather than
      # `npm install` so the same commit gets the same bundler.
      - name: install build deps
        run: npm ci
      # 6.1: one source of truth. This job used to name three scripts, while
      # `npm run test:static` named eight — so test-pgn, test-learning,
      # test-eco and test-review-winpct never ran in PR CI at all, and
      # test-classics was written and wired nowhere. A job that lists the
      # tests by hand drifts from the script that lists them; running the
      # script is the only arrangement where the two cannot disagree.
      - name: static tests
        run: npm run test:static
      # 7.1 (v7-1-plan §3.2): the sampled soundness gate.
      #
      # PR CI had no engine-backed check at all — every one of them lived in
      # release.yml, so a change to the puzzle bank or the mining rules was
      # first searched against a real engine at the moment of release. 150 of
      # the 1002 mined puzzles at depth 18 is about five minutes, the sample
      # is a fixed shuffle (same 150 every run, so the number does not move
      # on its own), and a sampled run now FAILS on a stored answer that is
      # more than 50cp worse — it used to print and exit 0, which made it
      # worth nothing as a gate. The full sweep stays: nightly.yml.
      - name: mined-puzzle soundness (sampled)
        run: node scripts/test-mined.mjs --sample=150
      # `free variables: node scripts/scope-check.mjs` used to sit here. The
      # sources are ES modules as of 1.25 and index.html loads one bundle, so
      # an unbound name is a build failure — test-chess.mjs asserts the bundle
      # resolves, which is the same rule enforced by the thing that ships.
      # manifest-check runs as the last step of `npm run test:static` above.

  browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # chromium ≈ the Windows WebView2 engine, webkit ≈ the macOS WKWebView
        # engine. fail-fast is off so a failure on one engine still reports the
        # other — "does this break everywhere or only on WebKit" is the first
        # question worth answering.
        engine: [chromium, webkit]
    env:
      E2E_REQUIRED: "1"
      E2E_BROWSER: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # esbuild, and nothing else. It bundles the ES modules under src/web/js
      # into the one classic script zero:// can load; `npm ci` rather than
      # `npm install` so the same commit gets the same bundler.
      - name: install build deps
        run: npm ci
      # Pinned. An unpinned install is how the same commit comes out different
      # on different days.
      #
      # Pinned is not the same as frozen, and for eight months it was: the pin
      # sat at 1.49.1 while the engines moved on. That is fine for Chromium —
      # WebView2 on a Windows machine updates itself and is roughly current
      # either way — and it is not fine for WebKit, which is the *whole* macOS
      # half of this gate. WKWebView is whatever the player's macOS ships, and
      # 1.49.1's WebKit is nearly two years behind that. A regression that
      # appears in the WebKit a real user has and not in the one this gate
      # runs is invisible here, which is the one failure mode a two-engine
      # gate exists to prevent. 1.62.1 is the current release; the pin should
      # be walked forward like this deliberately, not left to rot.
      - name: install playwright + ${{ matrix.engine }}
        run: |
          npm install --no-save playwright@1.62.1
          npx --yes playwright@1.62.1 install --with-deps ${{ matrix.engine }}
      - name: resolve the browser Playwright just installed
        run: |
          node -e "
            const pw = require('playwright');
            const p = pw['${{ matrix.engine }}'].executablePath();
            console.log('${{ matrix.engine }} =', p);
            require('fs').appendFileSync(process.env.GITHUB_ENV,
              ('${{ matrix.engine }}' === 'chromium' ? 'CHROME_PATH=' : 'WEBKIT_PATH=') + p + '\n');
          "
      - name: board
        run: node scripts/test-board-e2e.mjs
      - name: sound
        run: node scripts/test-audio-e2e.mjs
      - name: clock
        run: node scripts/test-clock-e2e.mjs
      - name: lessons + puzzles
        run: node scripts/test-content-e2e.mjs
      - name: persistence
        run: node scripts/test-persist-e2e.mjs
      - name: review
        run: node scripts/test-review-e2e.mjs
      - name: game library
        run: node scripts/test-library-e2e.mjs
      - name: panel layout
        run: node scripts/test-layout-e2e.mjs
      # The only browser check that serves the real engine-src.js — every one
      # above stubs it. Answers "does Stockfish start in the page as shipped"
      # on this matrix's engine (v7-4-plan §1).
      - name: engine (real Stockfish)
        run: node scripts/test-engine-e2e.mjs

  # src/main.zig and src/runner.zig, compiled and their tests run, on every
  # push — not only at release time. Until 6.0 the Zig side had no PR-time
  # CI at all, and 5.0–5.2 shipped three versions with dead file dialogs and
  # a dead Escape key from exactly that blind spot (v6-plan §1.2, Q0.2).
  #
  # Same toolchain as build-macos.yml: the SDK from npm (public registry, no
  # token — the platform builds install it the same way), zig 0.16.0 from
  # mlugg/setup-zig. `zig build` alone installs the exe and never packages;
  # frontend/dist is not needed for either step.
  zig:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: install build deps
        run: npm ci
      - name: install Native SDK CLI
        env:
          # the same pin the platform builds and release.yml carry
          SDK_VERSION: "0.10.1"
        run: |
          npm install -g "@native-sdk/cli@${SDK_VERSION}"
          native --version || true
          echo "resolved: $(npm ls -g --depth=0 @native-sdk/cli || true)"
          echo "SDK_PATH=$(npm root -g)/@native-sdk/cli" >> "$GITHUB_ENV"
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: derive the macOS manifest
        run: node scripts/gen-manifest.mjs macos
      - name: manifest keys are actually read (with the SDK on disk)
        run: node scripts/manifest-check.mjs --sdk "$SDK_PATH"
      - name: zig build test
        run: zig build test -Dmanifest=build/app.macos.zon -Dnative-sdk-path="$SDK_PATH"
      - name: zig build
        run: zig build -Dmanifest=build/app.macos.zon -Dnative-sdk-path="$SDK_PATH"
