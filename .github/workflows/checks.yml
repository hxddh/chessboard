name: checks

# Every check this repository has, on every PR (and every push to main) —
# and, called by release.yml, on every release: there is no check that runs
# only at release (scripts/ci-check.mjs holds that, ADR 0005).
#
#   static      npm run test:static on the three systems the app is built on:
#               the unit tests, the generated content re-made and compared
#               (gen-skills --check), the workflows, sdk-diff, the manifest,
#               the pinned versions, the icons (scripts/run-static.mjs)
#   browser     npm run test:app:e2e in Chromium (WebView2 is Chromium): the
#               pages, the board, play, review, learn, import, three
#               languages, first paint and the per-move cost
#   webkit      the same suites in Playwright's WebKit (macOS ships on
#               WKWebView): everything they check about behaviour; what only
#               Chromium can measure (the DevTools protocol's script time and
#               layout counts, long tasks) is skipped there and says so
#               (scripts/app/browser.mjs)
#   visual      every page at 1440×900, 1024×700 and 600×900 against the
#               committed baseline (scripts/test-visual-e2e.mjs)
#   zig         the shell: manifest keys read, sdk-diff against the SDK on
#               disk, zig build test, zig build, the automation seams on the
#               null platform
#   opponents   (when the opponents, Maia-3, the engine service or their
#               scripts change) every opponent converts a won position
#   native      (when the native side changes) build-macos.yml and
#               build-windows.yml: the packages built, the package as shipped
#               self-tested, the automation build's scenarios
#
# A path-gated job runs whatever changed on a workflow_dispatch and on a
# release (the event is then not a pull_request or a push).
#
# `push` is main only: on any other branch a commit with an open PR would run
# all of this twice for the same tree; the PR run is the one that gates.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

# A new push to a PR supersedes the run on the old head — cancel it. Not on
# main, and not in a release: every run there keeps its own record.
concurrency:
  group: checks-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    name: static (${{ matrix.os }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: install build deps
        run: npm ci
      - name: static tests
        run: npm run test:static

  browser:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    name: browser (Chromium)
    env:
      E2E_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: install build deps
        run: npm ci
      - name: install playwright
        id: pw
        run: |
          npm install --no-save playwright@1.64.0
          node scripts/ci-browser-deps.mjs key chromium
      - name: restore Chromium's system packages
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.pw.outputs.dir }}
          key: ${{ steps.pw.outputs.key }}
      - name: system packages for Chromium
        id: deps
        run: node scripts/ci-browser-deps.mjs install chromium
      - name: cache Chromium's system packages
        if: steps.deps.outputs.save == 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.pw.outputs.dir }}
          key: ${{ steps.pw.outputs.key }}
      - name: install Chromium
        run: |
          npx --yes playwright@1.64.0 install chromium
          echo "CHROME_PATH=$(node -e "console.log(require('playwright').chromium.executablePath())")" >> "$GITHUB_ENV"
      - name: the app in the browser
        run: npm run test:app:e2e

  webkit:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    name: browser (WebKit)
    env:
      E2E_REQUIRED: "1"
      BROWSER: webkit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: install build deps
        run: npm ci
      - name: install playwright
        id: pw
        run: |
          npm install --no-save playwright@1.64.0
          node scripts/ci-browser-deps.mjs key webkit
      - name: restore WebKit's system packages
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.pw.outputs.dir }}
          key: ${{ steps.pw.outputs.key }}
      - name: system packages for WebKit
        id: deps
        run: node scripts/ci-browser-deps.mjs install webkit
      - name: cache WebKit's system packages
        if: steps.deps.outputs.save == 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.pw.outputs.dir }}
          key: ${{ steps.pw.outputs.key }}
      - name: install WebKit
        run: npx --yes playwright@1.64.0 install webkit
      - name: the app in WebKit
        run: npm run test:app:e2e

  visual:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    name: visual baseline (Chromium)
    env:
      E2E_REQUIRED: "1"
      OUT: shots/visual
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: install build deps
        run: npm ci
      - name: install playwright
        id: pw
        run: |
          npm install --no-save playwright@1.64.0
          node scripts/ci-browser-deps.mjs key chromium
      - name: restore Chromium's system packages
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.pw.outputs.dir }}
          key: ${{ steps.pw.outputs.key }}
      - name: system packages for Chromium
        id: deps
        run: node scripts/ci-browser-deps.mjs install chromium
      - name: cache Chromium's system packages
        if: steps.deps.outputs.save == 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.pw.outputs.dir }}
          key: ${{ steps.pw.outputs.key }}
      - name: install Chromium
        run: |
          npx --yes playwright@1.64.0 install chromium
          echo "CHROME_PATH=$(node -e "console.log(require('playwright').chromium.executablePath())")" >> "$GITHUB_ENV"
      - name: every page against the baseline
        run: npm run test:visual
      - name: upload the shots and the differences
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual
          path: shots/visual/
          retention-days: 14

  zig:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            flags: -Dmanifest=build/app.macos.zon
          - os: windows-2025
            flags: -Dplatform=windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    name: zig (${{ matrix.os }})
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: install build deps
        run: npm ci
      - name: install Native SDK CLI
        env:
          SDK_VERSION: "0.11.0"
        run: |
          npm install -g "@native-sdk/cli@${SDK_VERSION}"
          echo "SDK_PATH=$(npm root -g)/@native-sdk/cli" >> "$GITHUB_ENV"
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          # a new key: the caches saved before the cleanup step below can be half-built
          cache-key: e3-clean
      - name: derive the macOS manifest
        if: matrix.os == 'macos-26'
        run: node scripts/gen-manifest.mjs macos
      - name: manifest keys are actually read (with the SDK on disk)
        run: node scripts/manifest-check.mjs --sdk "$SDK_PATH"
      - name: runner.zig / build.zig differ from the SDK only where registered
        run: node scripts/sdk-diff.mjs "$SDK_PATH"
      - name: zig build test
        run: zig build test ${{ matrix.flags }} -Dnative-sdk-path="$SDK_PATH"
      - name: zig build
        run: zig build ${{ matrix.flags }} -Dnative-sdk-path="$SDK_PATH"
      - name: automation seams (null platform)
        if: matrix.os == 'macos-26'
        run: |
          zig build -Dplatform=null -Dautomation=true -Dnative-sdk-path="$SDK_PATH" --prefix zig-out-null
          node scripts/automation-smoke.mjs zig-out-null/bin/chessboard --null
      # setup-zig saves .zig-cache in its post step even for a cancelled or
      # failed job: a build cut off mid-way left a cache whose manifests name
      # outputs it never wrote (zig (windows-2025) on 1bfc29f: native-sdk.manifest.res
      # missing, restored from run 42336843004, cancelled mid-build by a push).
      # Such a job saves an empty cache instead; the next one builds cold.
      - name: no half-built zig cache for the next run
        if: cancelled() || failure()
        shell: bash
        run: rm -rf .zig-cache

  changed:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    name: what changed
    outputs:
      opponents: ${{ steps.diff.outputs.opponents }}
      native: ${{ steps.diff.outputs.native }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          # the opponents: their profiles and mind, Maia-3, the engine service, the vendored nets, the game scripts
          opponents='^(src/app/core/opponents[^/]*\.js|src/app/opponents/|src/app/services/maia3/|src/app/services/engine\.js|third_party/(maia3|stockfish)/|scripts/(ladder20|test-convert)\.mjs|scripts/lib/(opp-game|sf-backend)\.mjs|scripts/fixtures/convert-positions\.json)'
          # the native side: the shell, its build, the manifest, the packaging and self-test scripts, the app's native services
          native='^(src/[^/]+\.zig|src/native/|build\.zig|build\.zig\.zon|app\.zon|assets/|scripts/(build-stockfish\.sh|add-engine\.sh|add-pgn-doctype\.sh|register-pgn\.(cmd|reg)|sync-dist\.mjs|build-app\.mjs|gen-manifest\.mjs|automation-app\.mjs|automation-smoke\.mjs)|scripts/lib/automation\.mjs|src/app/selftest\.js|src/app/services/(native|db-native|engine-native)\.js|\.github/workflows/build-(macos|windows)\.yml)'
          base="$BASE"; [ "$EVENT" = pull_request ] || base="$BEFORE"
          if [ "$EVENT" != pull_request ] && [ "$EVENT" != push ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "opponents=true" >> "$GITHUB_OUTPUT"; echo "native=true" >> "$GITHUB_OUTPUT"
          else
            files="$(git diff --name-only "$base" HEAD)"
            if grep -qE "$opponents" <<< "$files"; then echo "opponents=true"; else echo "opponents=false"; fi >> "$GITHUB_OUTPUT"
            if grep -qE "$native" <<< "$files"; then echo "native=true"; else echo "native=false"; fi >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  opponents:
    needs: changed
    if: needs.changed.outputs.opponents == 'true'
    strategy:
      fail-fast: false
      matrix:
        job: [1, 2, 3, 4]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    name: opponents convert (${{ matrix.job }}/4)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: install build deps
        run: npm ci
      - name: convert (four shards)
        shell: bash
        env:
          JOB: ${{ matrix.job }}
        run: |
          pids=()
          for k in 1 2 3 4; do
            node scripts/test-convert.mjs --shard=$(( (JOB - 1) * 4 + k ))/16 --out=out > /dev/null &
            pids+=($!)
          done
          bad=0
          for p in "${pids[@]}"; do wait "$p" || bad=$((bad + 1)); done
          if [ "$bad" -gt 0 ]; then echo "$bad shard(s) failed"; exit 1; fi
      - uses: actions/upload-artifact@v7
        with:
          name: convert-${{ matrix.job }}
          path: out/*.jsonl

  opponents-verdict:
    needs: opponents
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    name: opponents convert (verdict)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - uses: actions/download-artifact@v8
        with:
          pattern: convert-*
          path: out
          merge-multiple: true
      - name: every opponent converts
        run: node scripts/test-convert.mjs --in=out

  native-macos:
    needs: changed
    if: needs.changed.outputs.native == 'true'
    uses: ./.github/workflows/build-macos.yml

  native-windows:
    needs: changed
    if: needs.changed.outputs.native == 'true'
    uses: ./.github/workflows/build-windows.yml
